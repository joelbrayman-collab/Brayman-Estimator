<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block auth_title %}Sign in{% endblock %} — Brayman Construction Platform</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='branding/brayman-construction-logo.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    {% block auth_head %}{% endblock %}
</head>
<body class="login-page">
    <main class="login-card">
        <img
            class="login-logo"
            src="{{ url_for('static', filename='branding/brayman-construction-logo.png') }}"
            alt="Brayman Construction"
            width="180"
            height="72"
        >
        {% block auth_body %}{% endblock %}
    </main>
    {% block auth_scripts %}{% endblock %}
</body>
</html>
