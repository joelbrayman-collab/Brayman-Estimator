<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Sign in — Brayman Construction Platform</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='branding/brayman-construction-logo.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="login-page">
    <main class="login-card">
        <img
            class="login-logo"
            src="{{ url_for('static', filename='branding/brayman-construction-logo.png') }}"
            alt="Brayman Construction"
            width="180"
            height="72"
        >
        <h1>Office sign in</h1>
        <p class="login-lede">Use your organization membership credentials.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="flash-stack">
                {% for category, message in messages %}
                <div class="alert alert-{{ category }}" role="status">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
        {% endwith %}

        <form method="post" action="{{ url_for('auth.login') }}" class="login-form" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            {% if request.args.get('next') %}
            <input type="hidden" name="next" value="{{ request.args.get('next') }}">
            {% endif %}
            <label for="email">Email</label>
            <input id="email" type="email" name="email" autocomplete="username" required autofocus>
            <label for="password">Password</label>
            <input id="password" type="password" name="password" autocomplete="current-password" required>
            <button type="submit" class="button">Sign in</button>
        </form>
    </main>
</body>
</html>
