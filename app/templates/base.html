<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Brayman Estimator{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="brand">BRAYMAN ESTIMATOR</div>

        <nav>
            <a href="{{ url_for('main.dashboard') }}">Dashboard</a>
            <a href="{{ url_for('clients.list_clients') }}">Clients</a>
            <a href="{{ url_for('projects.list_projects') }}">Projects</a>
            <a href="#">Estimates</a>
            <a href="{{ url_for('cost_library.list_cost_items') }}">Cost Library</a>
            <a href="{{ url_for('assemblies.list_assemblies') }}">Assemblies</a>
        </nav>
    </header>

    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
